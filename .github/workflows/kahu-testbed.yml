name: Kahu Testbed

on:
  push:
    branches: [main]
    paths:
      - "packages/app/kahu-testbed/**"
      - "scripts/*kahu*"
      - "scripts/kahu-contract-snapshot/**"
      - "plans/kahu-*"
      - ".github/workflows/kahu-testbed.yml"
  pull_request:
    paths:
      - "packages/app/kahu-testbed/**"
      - "scripts/*kahu*"
      - "scripts/kahu-contract-snapshot/**"
      - "plans/kahu-*"
      - ".github/workflows/kahu-testbed.yml"
  workflow_dispatch:

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout KahuStack-OpenDAW
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Kahu browser workbench source
        run: |
          npm run typecheck:kahu
          npm run test:kahu
          npm run lint --workspace=@kahustack/opendaw-testbed
          npm run build:kahu
