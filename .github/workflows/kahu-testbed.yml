name: Kahu Testbed

on:
  push:
    branches: [main]
    paths:
      - "packages/app/kahu-testbed/**"
      - "scripts/*kahu*"
      - "scripts/kahu-contract-snapshot/**"
      - "plans/kahu-*"
      - ".github/workflows/kahu-testbed.yml"
  pull_request:
    paths:
      - "packages/app/kahu-testbed/**"
      - "scripts/*kahu*"
      - "scripts/kahu-contract-snapshot/**"
      - "plans/kahu-*"
      - ".github/workflows/kahu-testbed.yml"
  workflow_dispatch:

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout KahuStack-OpenDAW
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build OpenDAW package dependencies
        run: |
          npx turbo run build \
            --filter=@opendaw/lib-std \
            --filter=@opendaw/lib-dom \
            --filter=@opendaw/lib-jsx \
            --filter=@opendaw/studio-enums \
            --filter=@opendaw/studio-icons \
            --filter=@opendaw/studio-core

      - name: Typecheck Kahu workbench
        run: npm run typecheck:kahu

      - name: Test Kahu workbench
        run: npm run test:kahu

      - name: Lint Kahu workbench
        run: npm run lint --workspace=@kahustack/opendaw-testbed

      - name: Build Kahu workbench
        run: npm run build:kahu

      - name: Check staged Kahu runtime
        run: npm run check:kahu-runtime

      - name: Benchmark consolidated Kahu rack
        run: npm run perf:kahu-rack
