name: Kahu Testbed

on:
  push:
    branches: [main]
    paths:
      - "packages/app/kahu-testbed/**"
      - "scripts/*kahu*"
      - "scripts/kahu-contract-snapshot/**"
      - "plans/kahu-*"
      - ".github/workflows/kahu-testbed.yml"
  pull_request:
    paths:
      - "packages/app/kahu-testbed/**"
      - "scripts/*kahu*"
      - "scripts/kahu-contract-snapshot/**"
      - "plans/kahu-*"
      - ".github/workflows/kahu-testbed.yml"
  workflow_dispatch:

env:
  KAHU_DSP_PARENT_REF: 31595bef4a767d4852b5f44a6aaf8cafa84989c7
  KAHU_DSP_ROOT: ${{ github.workspace }}/kahustack-dsp-parent

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout KahuStack-OpenDAW
        uses: actions/checkout@v4

      - name: Fetch canonical KahuStack DSP
        run: |
          git clone --depth 1 --branch main https://github.com/parkermeredith/kahustack-dsp.git "$KAHU_DSP_ROOT"
          test "$(git -C "$KAHU_DSP_ROOT" rev-parse HEAD)" = "$KAHU_DSP_PARENT_REF"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install OpenDAW dependencies
        run: npm ci

      - name: Install canonical KahuStack DSP dependencies
        working-directory: kahustack-dsp-parent
        run: npm ci

      - name: Build canonical Kahu Rust-WASM runtime
        working-directory: kahustack-dsp-parent
        run: npm run build:wasm

      - name: Build OpenDAW package dependencies
        run: |
          npx turbo run build \
            --filter=@opendaw/lib-std \
            --filter=@opendaw/lib-dom \
            --filter=@opendaw/lib-jsx \
            --filter=@opendaw/studio-enums \
            --filter=@opendaw/studio-icons \
            --filter=@opendaw/studio-core

      - name: Typecheck Kahu workbench
        run: npm run typecheck:kahu

      - name: Test Kahu workbench
        run: npm run test:kahu

      - name: Lint Kahu workbench
        run: npm run lint --workspace=@kahustack/opendaw-testbed

      - name: Build Kahu workbench
        run: npm run build:kahu

      - name: Check staged Kahu runtime
        run: npm run check:kahu-runtime

      - name: Benchmark consolidated Kahu rack
        run: npm run perf:kahu-rack
